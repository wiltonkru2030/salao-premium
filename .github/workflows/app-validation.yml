name: App validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check syntax of every JavaScript file
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Build production application and validate module imports
        run: npm run build
      - name: Run utility regression tests
        run: npm run test:utils
      - name: Run Portuguese error handling tests
        run: npm run test:errors
      - name: Run quote component tests
        run: npm run test:quotes
      - name: Run Comanda component tests
        run: npm run test:comanda
      - name: Run agenda regression tests
        run: npm run test:agenda
