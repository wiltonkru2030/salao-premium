name: App validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax · shared autocomplete
        run: node --check src/components/autocomplete.js
      - name: Syntax · comanda
        run: node --check src/pages/comanda.js
      - name: Syntax · professionals
        run: node --check src/pages/professionals.js
      - name: Syntax · customers
        run: node --check src/pages/customers.js
      - name: Syntax · services
        run: node --check src/pages/services.js
      - name: Syntax · products
        run: node --check src/pages/products.js
      - name: Syntax · layout
        run: node --check src/layout/render.js
      - name: Syntax · data service
        run: node --check src/supabase/data-service.js
      - name: Syntax · professional PWA
        run: node --check professional/app.js
      - name: Run agenda regression tests
        run: npm run test:agenda
