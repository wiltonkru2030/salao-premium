name: Agenda tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test-agenda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks · application modules
        run: |
          node --check src/app.js
          node --check src/agenda/pages/agenda-page.js
          node --check src/agenda/components/appointment-form.js
          node --check src/pages/comanda.js
          node --check professional/app.js
      - name: Unit and component tests
        run: npm run test:agenda
