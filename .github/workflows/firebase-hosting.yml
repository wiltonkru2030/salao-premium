# Publica as três entradas Vite no Firebase Hosting após validação.
# Publicação manual ou promoção explícita pelo manifesto de release; alterações comuns não publicam.
name: Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/releases/professional-notifications-live.json'

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir configuração pública do build
        env:
          FIREBASE_PROJECT_ID: salao-premium
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_PROJECT_ID" || { echo 'Configure FIREBASE_PROJECT_ID nas variables do repositório.'; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo 'Configure FIREBASE_SERVICE_ACCOUNT nos secrets do repositório.'; exit 1; }
          node --input-type=module <<'NODE'
          // Variáveis opcionais; sem elas, usa o par público de produção já versionado.
          const {appendFileSync,readFileSync}=await import("node:fs");
          const source=readFileSync("src/supabase/config.js","utf8");
          let url=process.env.VITE_SUPABASE_URL?.trim(),key=process.env.VITE_SUPABASE_PUBLISHABLE_KEY?.trim();
          if(!url&&!key){
            url=source.match(/const defaultUrl = '([^']+)'/)?.[1];
            key=source.match(/const defaultPublishableKey = '([^']+)'/)?.[1];
          }
          if(url!=="https://vlifbvzlyzoncefvfgol.supabase.co"||!/^sb_publishable_[A-Za-z0-9_-]+$/.test(key||""))throw Error("Par público de produção ausente ou inválido.");
          appendFileSync(process.env.GITHUB_ENV,"VITE_SUPABASE_URL="+url+"\nVITE_SUPABASE_PUBLISHABLE_KEY="+key+"\n");
          const a=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          if(a.type!=="service_account"||a.project_id!=="salao-premium"||!a.client_email||!a.private_key)throw Error("Credencial de Hosting inválida ou de outro projeto.");
          NODE
      - name: Executar testes
        run: npm run test:all
      - name: Validar navegador antes de publicar
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          npx --yes vite@6 --host 127.0.0.1 --port 4173 --strictPort > /tmp/professional-vite.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/professional/ >/dev/null; then break; fi
            sleep 1
          done
          npm run test:professional-browser
      - name: Gerar as três aplicações
        env:
          # Par público validado e exportado pelo preflight (GITHUB_ENV).
          # Notificações internas e preferências têm contratos instalados na onda de produção 20261127214214.
          # Outros contratos continuam desativados até reconciliar o banco e homologar.
          VITE_PROFESSIONAL_CUSTOMER_REGISTRATION: 'false'
          VITE_PROFESSIONAL_NOTIFICATIONS: 'true'
          VITE_PROFESSIONAL_PROFILE_PREFERENCES: 'true'
          VITE_PROFESSIONAL_ORDER_MANAGEMENT: 'false'
          VITE_PROFESSIONAL_ATTENDANCE: 'false'
          VITE_PROFESSIONAL_SERVICE_MANAGEMENT: 'false'
          VITE_PROFESSIONAL_UNIT_BOOKING: 'false'
          VITE_PROFESSIONAL_EXPLICIT_BRANCH: 'false'
          # Transporte FCM validado em produção; inscrição explícita habilitada, envio ainda separado.
          VITE_PROFESSIONAL_PUSH: 'true'
          VITE_COMANDA_PAYMENT_IDEMPOTENCY: 'false'
        run: npm run build
      - name: Conferir pacote e branch antes da publicação
        run: |
          grep -r -q 'vlifbvzlyzoncefvfgol.supabase.co' dist/assets
          if grep -r -q 'eaiutjqvyesboldcznyr.supabase.co' dist/assets; then
            echo 'Publicação bloqueada: referência QA no pacote live.'; exit 1
          fi
          test -f dist/index.html && test -f dist/cliente/index.html && test -f dist/professional/index.html && test -f dist/professional/sw.js
          git fetch origin main --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || { echo 'main avançou; promova somente a revisão atual.'; exit 1; }
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: deploy
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: salao-premium
          channelId: live

      - name: Verificar bytes publicados nas três aplicações
        env:
          LIVE_URL: https://salao-premium.web.app
        run: node tests/integration/production-hosting-smoke.mjs
