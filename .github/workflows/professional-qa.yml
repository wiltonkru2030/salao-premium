# Compila uma versão isolada, com todos os módulos profissionais habilitados.
# O ZIP aponta somente para QA; preview temporário quando houver credencial de Hosting.
name: Professional QA package
on:
  push:
    branches: [main]
    paths:
      - 'professional/**'
      - 'src/**'
      - 'supabase/**'
      - 'tests/integration/professional-auth-qa.mjs'
      - 'tests/integration/professional-hosting-smoke.mjs'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/professional-qa.yml'
      - 'package.json'
      - 'vite.config.js'
  workflow_dispatch:
    inputs:
      deploy_preview:
        description: Publicar pacote QA em canal temporário do Firebase (não live)
        type: boolean
        default: false
      run_auth:
        description: Executar Auth real com contas fictícias em QA
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build-qa:
    runs-on: ubuntu-24.04
    env:
      VITE_SUPABASE_URL: https://eaiutjqvyesboldcznyr.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wewwCre-CzGgHXLsQtK8fg_qsUpXJmr
      VITE_PROFESSIONAL_APPOINTMENT_STATUS: 'true'
      VITE_PROFESSIONAL_RESCHEDULE: 'true'
      VITE_PROFESSIONAL_BOOKING: 'true'
      VITE_PROFESSIONAL_CUSTOMER_REGISTRATION: 'true'
      VITE_PROFESSIONAL_NOTIFICATIONS: 'true'
      VITE_PROFESSIONAL_PROFILE_PREFERENCES: 'true'
      VITE_PROFESSIONAL_ORDER_MANAGEMENT: 'true'
      VITE_PROFESSIONAL_ATTENDANCE: 'true'
      VITE_PROFESSIONAL_SERVICE_MANAGEMENT: 'true'
      VITE_PROFESSIONAL_UNIT_BOOKING: 'true'
      VITE_PROFESSIONAL_EXPLICIT_BRANCH: 'true'
      VITE_PROFESSIONAL_PUSH: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - name: Conferir destino QA e assets da PWA
        run: |
          grep -r -q 'eaiutjqvyesboldcznyr.supabase.co' dist/assets
          test -f dist/professional/index.html
          test -f dist/professional/sw.js
          test -f dist/professional/manifest.webmanifest
          grep -r -q '357526985236' dist/assets
      - uses: actions/upload-artifact@v4
        with:
          name: salao-premium-qa
          path: dist/
          retention-days: 7
  preview-qa:
    # Publicação temporária exclusivamente QA; nunca usa o canal live.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_preview))
    needs: build-qa
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: professional-qa-hosting
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Verificar disponibilidade da credencial de Hosting
        id: hosting-credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Hosting QA: falta o secret FIREBASE_SERVICE_ACCOUNT.' >> "$GITHUB_STEP_SUMMARY"
            echo 'HOSTING_QA_SECRET_MISSING'
            exit 0
          fi
          node --input-type=module <<'NODE'
          const a=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          if(a.type!=="service_account"||a.project_id!=="salao-premium"||!a.client_email||!a.private_key)throw Error("Credencial de Hosting inválida ou de outro projeto.");
          NODE
          echo 'available=true' >> "$GITHUB_OUTPUT"
          echo 'HOSTING_QA_SECRET_AVAILABLE'
      - uses: actions/checkout@v4
        if: steps.hosting-credential.outputs.available == 'true'
      - uses: actions/download-artifact@v4
        if: steps.hosting-credential.outputs.available == 'true'
        with:
          name: salao-premium-qa
          path: dist/
      - name: Conferir pacote isolado
        if: steps.hosting-credential.outputs.available == 'true'
        run: |
          test -f dist/professional/index.html
          grep -r -q 'eaiutjqvyesboldcznyr.supabase.co' dist/assets
          if grep -r -q 'vlifbvzlyzoncefvfgol.supabase.co' dist/assets; then
            echo 'Publicação bloqueada: referência de produção no pacote QA.'; exit 1
          fi
      - name: Publicar canal temporário
        id: deploy
        if: steps.hosting-credential.outputs.available == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: salao-premium
          channelId: professional-qa
          expires: 7d
          disableComment: true
      - name: Testar PWA no endereço publicado
        if: steps.hosting-credential.outputs.available == 'true'
        env:
          QA_PREVIEW_URL: ${{ steps.deploy.outputs.details_url }}
        run: node tests/integration/professional-hosting-smoke.mjs
      - name: Credencial necessária para publicação manual
        if: steps.hosting-credential.outputs.available == 'false' && github.event_name == 'workflow_dispatch'
        run: exit 1
  auth-qa:
    if: github.event_name == 'workflow_dispatch' && inputs.run_auth
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SUPABASE_TEST_ENV: isolated
      SUPABASE_URL: https://eaiutjqvyesboldcznyr.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_wewwCre-CzGgHXLsQtK8fg_qsUpXJmr
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_QA_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testar Auth real somente em QA
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'Secret SUPABASE_QA_SERVICE_ROLE_KEY não configurado.'; exit 1; }
          node tests/integration/professional-auth-qa.mjs
